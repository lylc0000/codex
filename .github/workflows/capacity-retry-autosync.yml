# 官方 codex 一发新版，自动：拉取 → 打补丁 → 测试 → 编译 → 发 Release
# 推送到 fork 的 capacity-retry-fast 分支：
#   .github/workflows/capacity-retry-autosync.yml
# 公共仓库 Actions 免费；测试和编译拆成并行 job，各有独立超时。
name: Capacity-retry autosync

on:
  schedule:
    - cron: "23 */6 * * *" # 每 6 小时检查一次上游（公共仓库定时任务 60 天无提交活动会被停用，手动 dispatch 随时可用）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: capacity-retry-autosync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      branch: ${{ steps.decide.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capacity-retry-fast
          fetch-depth: 0

      - name: Detect latest upstream release
        id: latest
        run: echo "tag=$(gh api repos/openai/codex/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          BRANCH="capacity-retry-auto/$TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/capacity-retry-$TAG" >/dev/null 2>&1; then
            echo "Release capacity-retry-$TAG 已存在，无需重建。" >&2
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Apply patch onto upstream tag
        if: steps.decide.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
          BRANCH: ${{ steps.decide.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "capacity-retry-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/openai/codex.git
          git fetch upstream "refs/tags/$TAG:refs/tags/$TAG" --no-tags

          BASE="$(git merge-base capacity-retry-fast "$TAG")"
          echo "补丁基线: $BASE"

          # 只把两个源码文件的差异做成补丁（workflow 直接从分支拷贝）
          git diff "$BASE" capacity-retry-fast -- \
            codex-rs/core/src/responses_retry.rs \
            codex-rs/core/src/responses_retry_tests.rs > /tmp/capacity-retry.patch

          # 新分支从官方 tag 出发，工作区即官方代码，补丁检查针对它进行
          git checkout -B "$BRANCH" "$TAG"

          APPLY_FLAGS="--3way"
          if git apply --3way --check /tmp/capacity-retry.patch 2>/tmp/apply.err; then
            : # 常规三方合并可用
          elif git apply --3way -C1 --check /tmp/capacity-retry.patch 2>>/tmp/apply.err; then
            APPLY_FLAGS="--3way -C1" # 官方在补丁附近改了上下文，放宽匹配仍可自动套用
          else
            TITLE="Patch conflict on $TAG"
            BODY="对 $TAG 应用 capacity-retry 补丁失败，需要手工 rebase。\n\n\`\`\`\n$(head -c 3000 /tmp/apply.err)\n\`\`\`\n\n补丁内容为 capacity-retry-fast 分支相对 $BASE 在 responses_retry.rs / responses_retry_tests.rs 上的改动。"
            ISSUE_URL="$(gh issue list --state open --search "$TITLE" --json url --jq '.[0].url')"
            if [ -z "$ISSUE_URL" ]; then
              gh issue create --title "$TITLE" --body "$(printf "$BODY")"
            else
              echo "已有同名 issue：$ISSUE_URL"
            fi
            exit 1
          fi

          git apply $APPLY_FLAGS /tmp/capacity-retry.patch
          git add -A
          git commit -m "Apply capacity fast-retry patch onto $TAG"
          git push --force origin "$BRANCH"

  test:
    needs: sync
    if: needs.sync.outputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.branch }}
          fetch-depth: 1

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs -> target

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check

      - name: Test automatic capacity retry
        shell: pwsh
        run: >
          cargo test --manifest-path codex-rs/Cargo.toml
          -p codex-core --lib server_overloaded_fast_retry
          -- --nocapture

  build:
    needs: sync
    if: needs.sync.outputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.branch }}
          fetch-depth: 1

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs -> target

      - name: Build Windows Codex executable
        shell: pwsh
        run: >
          cargo build --manifest-path codex-rs/Cargo.toml
          --release -p codex-cli --bin codex

      - name: Verify executable
        shell: pwsh
        run: |
          .\codex-rs\target\release\codex.exe --version
          .\codex-rs\target\release\codex.exe --help | Select-Object -First 5

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: codex-windows-x64-capacity-retry
          path: codex-rs/target/release/codex.exe
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [sync, test, build]
    if: needs.sync.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.branch }}
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: codex-windows-x64-capacity-retry

      - name: Tag, release, cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.sync.outputs.tag }}
          BRANCH: ${{ needs.sync.outputs.branch }}
        run: |
          SHA256="$(sha256sum codex.exe | cut -d' ' -f1)"
          REL="capacity-retry-$TAG"
          NOTES="capacity-retry build based on $TAG.

          SHA256: \`$SHA256\`
          关闭快速重试: CODEX_CAPACITY_RETRY_FAST=0"
          gh release create "$REL" --title "$REL" --notes "$(printf "$NOTES")" codex.exe
          git push origin ":$BRANCH" || true # 删除临时分支，保留 tag/release
